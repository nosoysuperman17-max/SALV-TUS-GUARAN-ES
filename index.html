function upd(d){
  t+=d;

  tx_('MEJOR ₲ '+gs(best),W-10,40,'#9cb',7,'right');
  x.fillStyle='rgba(10,36,32,.85)';x.fillRect(W-150,48,140,18);x.strokeStyle='#7ec8ff';x.lineWidth=2;x.strokeRect(W-150,48,140,18);
  tx_('IPS ₲ '+gs(ips),W-80,61,'#7ec8ff',7);snd();
  const rem=Math.max(0,Math.ceil((lim-t)/60));
  if(t>lim&&Math.floor(fr/8)%2)tx_('¡IMPOSIBLE!',180,150,'#ff4d4d',12);
  tx_(Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'),10,62,t>lim?'#ff4d4d':'#9cb',8,'left');
  if(x2>0)tx_('x2 '+Math.ceil(x2/60)+'s',10,82,'#ffd23f',8,'left');
  logo(52,30,.45);
  x.fillStyle='#0a2420';x.fillRect(10,H-22,W-20,14);
  x.fillStyle=bank>MAX*.7?'#ff4d4d':'#2fd2a4';x.fillRect(12,H-20,(W-24)*bank/MAX,10);
  tx_('PLATA DEL BANCO',180,H-12,'#fff',7);
  if(shield>0)tx_('COLCHÓN '+Math.ceil(shield/60)+'s',180,H-110,'#ff8fb1',8);
  if(st==='over'){
    x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);
    x.save();x.translate(180,220);x.rotate(-.18);x.fillStyle='rgba(220,40,40,.92)';x.fillRect(-150,-34,300,68);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(-144,-28,288,56);tx_('INTERVENIDO',0,9,'#fff',22);x.restore();
    tx_('Salvaste ₲ '+gs(score),180,310,'#f5d03b',11);
    tx_('Del IPS: ₲ '+gs(ips),180,334,'#7ec8ff',9);
    {const s2=Math.floor(t/60);tx_('Duraste '+Math.floor(s2/60)+':'+String(s2%60).padStart(2,'0'),180,356,'#fff',9)}
    tx_(quote,180,384,'#9cb',8);
    tx_('Mejor: ₲ '+gs(best),180,406,'#fff',9);
    if(leaderboard.length)tx_('🏆 '+leaderboard[0].player_name+' ₲'+gs(leaderboard[0].score),180,426,'#f5d03b',7);
    if(Math.floor(fr/30)%2)tx_('TOCÁ PARA REINTENTAR',180,452,'#2fd2a4',10);
    drawLBBtn(1);
  }
  x.restore();
}
let last=performance.now();
function loop(n){const d=Math.min(2,(n-last)/16.67);last=n;fr+=d;if(st==='play')upd(d);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
