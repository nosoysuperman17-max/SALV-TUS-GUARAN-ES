<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salvá tus guaraníes</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0a2420;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated}
</style></head><body>
<canvas id="c" width="360" height="600"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=600;
x.imageSmoothingEnabled=false;
function rs(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',rs);rs();
const PAL={K:'#1b1b2f',S:'#f1c27d',R:'#d33',Y:'#f5d03b',B:'#3b5bdb',D:'#2b2d42',G:'#c9a227',W:'#fff',M:'#5a3a22',O:'#cfefff'};
const PL=["....KKKK....","...KRRRRK...","..KRRRRRRK..","..KSSSSSSK..","..KSKSSKSK..","..KSSSSSSK..","...KSSSSK...","..KYYYYYYK..",".KYYYYYYYYK.",".KSYYYYYYSK.","..KYYYYYYK..","..KBBBBBBK..","..KBB..BBK..","..KKK..KKK.."];
const VL=[".....KKKKKK.....",".....KDDDDK.....",".....KDDDDK.....",".....KGGGGK.....","..KKKKKKKKKKKK..","....KSSSSSSK....","...KSSSSSSSSK...","...KSKSSSGOGSK..","...KSSSSSSSSSK..","...KMMMMMMMMK...","....KSSSSSSK....","..KKWWWWWWWWKK..",".KDDDDWRRWDDDDK.",".KDDDDDRRDDDDDK.",".KDDDDDDDDDDDDK.",".KDDDDDDDDDDDDK.","..KDDDDKKDDDDK..","..KKKKK..KKKKK.."];
const CN=["..KKKK..",".KYYYYK.","KYYGGYYK","KYGYYGYK","KYGYYGYK","KYYGGYYK",".KYYYYK.","..KKKK.."];
function spr(a,px,py,s){for(let j=0;j<a.length;j++)for(let i=0;i<a[j].length;i++){const c=a[j][i];if(c!=='.'){x.fillStyle=PAL[c];x.fillRect(Math.round(px+i*s),Math.round(py+j*s),s,s)}}}
const F=n=>x.font=n+"px 'Press Start 2P',monospace";
function tx_(s,px,py,col,sz,al){F(sz||10);x.textAlign=al||'center';x.fillStyle=col||'#fff';x.fillText(s,px,py)}
const gs=n=>n?String(Math.round(n*100000)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'0';
function pop(px_,s,col){fl.push({x:px_,y:H-110,s,col,l:60})}
function ipsb(cx,cy){const on=Math.floor(fr/6)%2;x.fillStyle=on?'#ffe14d':'#fff';x.fillRect(cx-24,cy-14,48,28);x.strokeStyle='#1b1b2f';x.lineWidth=2;x.strokeRect(cx-24,cy-14,48,28);tx_('IPS',cx,cy+1,on?'#d33':'#2455c4',10);tx_('+500.000',cx,cy+11,'#1b1b2f',5)}
function rock(c){const cx=c.x,cy=c.y,k=c.p>=10?1.7:c.p>=4?1.35:c.p<1?.75:1;x.save();x.translate(cx,cy);x.scale(k,k);x.translate(-cx,-cy);x.fillStyle='#8a8a99';x.fillRect(cx-28,cy-12,56,26);x.fillRect(cx-22,cy-18,44,38);x.fillStyle='#6b6b7a';x.fillRect(cx-22,cy+8,44,12);x.fillRect(cx+10,cy-18,12,38);x.strokeStyle='#1b1b2f';x.lineWidth=2;x.strokeRect(cx-22,cy-18,44,38);x.restore();tx_(c.n,cx,cy+3,'#fff',5)}
function note(cx,cy){x.fillStyle='#6fcf8a';x.fillRect(cx-26,cy-12,52,24);x.fillStyle='#4aa86a';x.fillRect(cx-22,cy-8,44,16);x.strokeStyle='#1b1b2f';x.lineWidth=2;x.strokeRect(cx-26,cy-12,52,24);tx_('₲100.000',cx,cy+3,'#fff',6)}
const MAX=14,RN=[{n:"VAZQUEZ",p:5},{n:"SANTI",p:2},{n:"HURREROS",p:.5},{n:"BCP",p:1},{n:"UPYS",p:1},{n:"Dr. Rotura",p:1},{n:"BCP",p:10}],FR=['“Su dinero está seguro™”','“Sistema en mantenimiento”','“Es solo un rumor”','“Volvé mañana”','“Capital en camino”'];
let st='menu',px=180,tx=180,coins=[],score=0,bank=0,t=0,vx=180,vd=1,ph=0,beam=0,ips=0,fl=[],bt=150,bph=0,x2=0,lim=3600,shield=0,spawn=0,best=0,shake=0,fr=0,overT=0,quote=FR[0],keys={};
try{best=+localStorage.getItem('b')||0}catch(e){}
let AC=null,mute=false,mus=0,mi=0;
const PAT=[220,262,330,262,196,247,294,247,174,220,262,220,196,247,294,392];
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function bp(f,dur,type,vol,f2,dl){if(!AC||mute)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(dl||0);o.type=type||'square';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);g.gain.setValueAtTime(vol||.08,s);g.gain.exponentialRampToValueAtTime(.001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.02)}
function nz(dur,vol){if(!AC||mute)return;const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}
const SFX={coin:()=>{bp(988,.07,'square',.06);bp(1319,.12,'square',.06,0,.07)},ips:()=>[523,659,784,1047].forEach((f,i)=>bp(f,.1,'square',.07,0,i*.07)),rock:()=>{bp(120,.25,'sawtooth',.12,40);nz(.15,.1)},bad:()=>bp(200,.3,'sawtooth',.09,80),pw:()=>[392,523,659,784,1047].forEach((f,i)=>bp(f,.08,'triangle',.1,0,i*.05)),slurp:()=>bp(200,.5,'sawtooth',.06,900),steal:()=>bp(500,.15,'square',.07,150),start:()=>[262,330,392,523].forEach((f,i)=>bp(f,.09,'square',.07,0,i*.08)),over:()=>[440,370,311,262,196].forEach((f,i)=>bp(f,.22,'square',.09,0,i*.18))};
function snd(){tx_(mute?'SON OFF':'SON ON',10,106,'#9cb',6,'left')}
function mu(){return x2>0?2:1}
function reset(){coins=[];score=0;bank=0;t=0;shield=0;spawn=0;beam=0;shake=0;vx=180;ips=0;fl=[];bt=150;bph=0;x2=0;lim=3600;st='play';SFX.start()}
let dx0=0,dp0=180,dn=0;
function mv(e){if(!dn)return;const r=cv.getBoundingClientRect();tx=Math.max(24,Math.min(336,dp0+(e.clientX-dx0)*W/r.width))}
cv.addEventListener('pointermove',mv);
cv.addEventListener('pointerup',()=>dn=0);cv.addEventListener('pointercancel',()=>dn=0);
cv.addEventListener('pointerdown',e=>{au();const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)*W/r.width,gy=(e.clientY-r.top)*H/r.height;if(gx<56&&gy>92&&gy<120){mute=!mute;return}dn=1;dx0=e.clientX;dp0=tx;if(st==='menu'||(st==='over'&&performance.now()-overT>700))reset()});
addEventListener('keydown',e=>{au();if(e.key==='m')mute=!mute;keys[e.key]=1;if((e.key===' '||e.key==='Enter')&&st!=='play'&&(st==='menu'||performance.now()-overT>700))reset()});
addEventListener('keyup',e=>keys[e.key]=0);
function upd(d){
 t+=d;const lvl=t>lim?3.2+(t-lim)/300:1+2.2*t/lim;if(x2>0)x2-=d;if(t>lim+1500)bank=MAX;mus-=d;if(mus<=0){mus=Math.max(8,18-lvl*1.2);bp(PAT[mi++%PAT.length],.12,'triangle',.05)}
 if(keys.ArrowLeft)tx-=6*d;if(keys.ArrowRight)tx+=6*d;tx=Math.max(24,Math.min(336,tx));
 px+=(tx-px)*Math.min(1,.18*d);
 ph+=(.014+lvl*.002)*d;vx=180+100*Math.sin(ph)+35*Math.sin(ph*2.3+1);
 if(shield>0)shield-=d;
 bt-=d;if(bt<=0){if(bph===0){bph=1;bt=30}else if(bph===1){bph=2;bt=50+lvl*8;if(shield<=0)SFX.slurp()}else{bph=0;bt=Math.max(70,200-lvl*14)}}beam=shield>0?0:t>lim?1:bph===2?1:bph===1?.5:0;
 spawn-=d;
 if(spawn<=0){const imp=t>lim;spawn=imp?Math.max(4,10-(t-lim)/200):Math.max(16,38-lvl*3);const r=Math.random(),rk=imp?.6:t>420?Math.min(.3,.04+(lvl-1)*.1):0;let k='c';if(r<rk)k='r';else if(r<rk+.06)k='i';else if(r<rk+.12)k='b';else if(r<rk+.16)k='m';const rn=RN[Math.floor(Math.random()*RN.length)];coins.push({x:30+Math.random()*300,y:-10,vy:Math.min(imp?9:6,1.5+lvl*.3)+Math.random(),k,s:0,n:rn.n,p:rn.p})}
 for(const c of coins){
  if(c.s){const dx=vx-c.x,dy=84-c.y;c.x+=dx*.14*d;c.y+=dy*.14*d;if(Math.abs(dx)<8&&Math.abs(dy)<8){c.dead=1;if(c.k==='c'){bank++;shake=8;SFX.steal()}}continue}
  c.y+=c.vy*d;
  if(beam===1&&(c.k==='c'||c.k==='m')&&c.y>90&&c.y<300&&Math.abs(c.x-vx)<14+(c.y-84)*.2)c.s=1;
  if(c.y>H-96&&c.y<H-40&&Math.abs(c.x-px)<(shield>0?50:34)){c.dead=1;if(c.k==='c'){score+=mu();bank=Math.max(0,bank-.25);SFX.coin()}else if(c.k==='i'){score+=5*mu();ips+=5*mu();bank=Math.max(0,bank-1);pop(c.x,'+₲'+gs(5*mu())+' IPS','#7ec8ff');SFX.ips()}else if(c.k==='r'){if(shield>0){pop(c.x,'¡Reboto!','#ff8fb1');SFX.coin()}else{SFX.rock();score=Math.max(0,score-c.p);shake=8;pop(c.x,'-₲'+gs(c.p),'#ff6b6b')}}else if(c.k==='b'){x2=300;pop(c.x,'x2 ¡5 segundos!','#ffd23f');SFX.pw()}else{shield=420;lim+=180;pop(c.x,'¡COLCHÓN +3s!','#ff8fb1');SFX.pw()}}
  else if(c.y>H+10)c.dead=1;
 }
 coins=coins.filter(c=>!c.dead);for(const f of fl){f.y-=.6*d;f.l-=d}fl=fl.filter(f=>f.l>0);
 if(bank>=MAX){st='over';SFX.over();overT=performance.now();quote=FR[Math.floor(Math.random()*FR.length)];if(score>best){best=score;try{localStorage.setItem('b',best)}catch(e){}}}
}
function logo(cx,cy,k){const w=150*k,h=60*k;x.fillStyle='#2fd2a4';x.fillRect(cx-w/2,cy-h/2,w,h);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(cx-w/2+3,cy-h/2+3,w-6,h-6);tx_('BUENO',cx,cy+2*k,'#fff',16*k);tx_('BANK',cx,cy+20*k,'#fff',9*k)}
function draw(){
 x.save();
 if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake-=.5}
 x.fillStyle='#14463d';x.fillRect(0,0,W,H);
 x.fillStyle='#195448';for(let i=0;i<H;i+=40)x.fillRect(0,i,W,2);
 if(st==='menu'){
  logo(180,120,1.4);snd();
  tx_('SALVÁ TUS',180,230,'#f5d03b',16);tx_('GUARANÍES',180,256,'#f5d03b',16);
  spr(VL,116,290,8);
  tx_('Arrastrá para mover',180,470,'#fff',9);tx_('y atrapá billetes de ₲100.000.',180,488,'#fff',8);
  tx_('Tenés 1 minuto. Bono = x2',180,508,'#ff8fb1',8);tx_('Esquivá las piedras.',180,526,'#ff8fb1',9);
  if(Math.floor(fr/30)%2)tx_('TOCÁ PARA JUGAR',180,550,'#2fd2a4',11);
  tx_('Parodia ficticia. Cualquier parecido es coincidencia.',180,586,'#7aa',6);
  x.restore();return}
 // villano y aspiradora
 spr(VL,vx-32,8,4);
 x.fillStyle='#889';x.fillRect(vx-10,80,20,10);x.fillStyle='#556';x.fillRect(vx-14,88,28,4);
 if(beam>0){
  x.beginPath();x.moveTo(vx-14,92);x.lineTo(vx+14,92);x.lineTo(vx+58,300);x.lineTo(vx-58,300);x.closePath();
  if(beam===1){x.fillStyle='rgba(120,255,200,.28)';x.fill();tx_('¡SLURP!',vx,130+Math.sin(fr/3)*4,'#fff',9)}
  else if(Math.floor(fr/6)%2){x.strokeStyle='rgba(255,255,255,.5)';x.setLineDash([6,6]);x.stroke();x.setLineDash([])}
 }
 // monedas
 for(const c of coins){
  if(c.k==='c')note(c.x,c.y);
  else if(c.k==='i')ipsb(c.x,c.y);
  else if(c.k==='r')rock(c);
  else if(c.k==='b'){x.fillStyle='#ffd23f';x.fillRect(c.x-16,c.y-10,32,20);x.strokeStyle='#1b1b2f';x.lineWidth=2;x.strokeRect(c.x-16,c.y-10,32,20);tx_('BONO',c.x,c.y-1,'#1b1b2f',6);tx_('x2',c.x,c.y+8,'#d33',7)}
  else{x.fillStyle='#ff8fb1';x.fillRect(c.x-15,c.y-9,30,18);x.fillStyle='#fff';for(let i=-9;i<12;i+=9)x.fillRect(c.x+i-1,c.y-9,3,18);x.strokeStyle='#1b1b2f';x.lineWidth=2;x.strokeRect(c.x-15,c.y-9,30,18)}
 }
 // jugador
 if(shield>0){x.fillStyle='rgba(255,143,177,.3)';x.beginPath();x.arc(px,H-62,48,0,7);x.fill()}
 spr(PL,px-24,H-90,4);
 for(const f of fl)tx_(f.s,Math.max(50,Math.min(310,f.x)),f.y,f.col,7);
 // HUD
 tx_('₲ '+gs(score),W-10,24,'#f5d03b',9,'right');
 tx_('MEJOR ₲ '+gs(best),W-10,40,'#9cb',7,'right');x.fillStyle='rgba(10,36,32,.85)';x.fillRect(W-150,48,140,18);x.strokeStyle='#7ec8ff';x.lineWidth=2;x.strokeRect(W-150,48,140,18);tx_('IPS ₲ '+gs(ips),W-80,61,'#7ec8ff',7);snd();const rem=Math.max(0,Math.ceil((lim-t)/60));if(t>lim&&Math.floor(fr/8)%2)tx_('¡IMPOSIBLE!',180,150,'#ff4d4d',12);tx_(Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'),10,62,t>lim?'#ff4d4d':'#9cb',8,'left');if(x2>0)tx_('x2 '+Math.ceil(x2/60)+'s',10,82,'#ffd23f',8,'left');
 logo(52,30,.45);
 x.fillStyle='#0a2420';x.fillRect(10,H-22,W-20,14);
 x.fillStyle=bank>MAX*.7?'#ff4d4d':'#2fd2a4';x.fillRect(12,H-20,(W-24)*bank/MAX,10);
 tx_('PLATA DEL BANCO',180,H-12,'#fff',7);
 if(shield>0)tx_('COLCHÓN '+Math.ceil(shield/60)+'s',180,H-110,'#ff8fb1',8);
 if(st==='over'){
  x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);
  x.save();x.translate(180,240);x.rotate(-.18);x.fillStyle='rgba(220,40,40,.92)';x.fillRect(-150,-34,300,68);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(-144,-28,288,56);tx_('INTERVENIDO',0,9,'#fff',22);x.restore();
  tx_('Salvaste ₲ '+gs(score),180,330,'#f5d03b',11);tx_('Del IPS: ₲ '+gs(ips),180,356,'#7ec8ff',9);{const s2=Math.floor(t/60);tx_('Duraste '+Math.floor(s2/60)+':'+String(s2%60).padStart(2,'0'),180,380,'#fff',9)}
  tx_(quote,180,412,'#9cb',8);
  tx_('Mejor: ₲ '+gs(best),180,438,'#fff',9);
  if(Math.floor(fr/30)%2)tx_('TOCÁ PARA REINTENTAR',180,470,'#2fd2a4',10);
 }
 x.restore();
}
let last=performance.now();
function loop(n){const d=Math.min(2,(n-last)/16.67);last=n;fr+=d;if(st==='play')upd(d);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
