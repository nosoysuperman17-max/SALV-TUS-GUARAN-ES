<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SANTI FIGHTER</title>
  <!--
    Este es el shell HTML del juego. El juego real está en src/main.js.
    Para modificar la UI (pantalla de inicio, HUD, pantalla final):
      - Editar este archivo
    Para modificar la lógica del juego:
      - Ver src/game/ y src/characters/
    Para modificar controles:
      - Ver src/engine/input.js
    Para modificar audio:
      - Ver src/engine/audio.js
    Para modificar física:
      - Ver src/engine/physics.js
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
    }

    /* Canvas con letterboxing — siempre 900x450 lógicos sin distorsión */
    #gameCanvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width:  min(100vw, calc(100vh * 2));
      height: min(100vh, calc(100vw / 2));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ─── Botones touch (mobile) ───────────────────────────────────── */
    #touchControls {
      display: none; /* se muestra solo en touch devices via JS */
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 10;
    }

    .touch-btn {
      pointer-events: all;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .touch-btn:active { background: rgba(255,255,255,0.35); }

    /* D-pad (izquierda) */
    #dpad {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 130px;
      height: 130px;
    }

    #dpad .touch-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-left  { left: 0;   top: 44px; }
    #btn-right { right: 0;  top: 44px; }
    #btn-up    { left: 44px; top: 0;   }
    #btn-down  { left: 44px; bottom: 0; }

    /* Botones de acción (derecha) */
    #actionBtns {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 8px;
    }

    #actionBtns .touch-btn {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    #btn-special { grid-column: 1 / -1; background: rgba(255, 100, 0, 0.25); }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="900" height="450"></canvas>

  <!-- Controles táctiles para mobile -->
  <div id="touchControls">
    <div id="dpad">
      <button class="touch-btn" id="btn-left"  >◀</button>
      <button class="touch-btn" id="btn-right" >▶</button>
      <button class="touch-btn" id="btn-up"    >▲</button>
      <button class="touch-btn" id="btn-down"  >▼</button>
    </div>
    <div id="actionBtns">
      <button class="touch-btn" id="btn-punch"  >P</button>
      <button class="touch-btn" id="btn-kick"   >K</button>
      <button class="touch-btn" id="btn-guard"  >G</button>
      <button class="touch-btn" id="btn-special">⚡ ESPECIAL</button>
    </div>
  </div>

  <!--
    Google Fonts: Press Start 2P (pixel font)
    Para cambiar la fuente del juego, cambiar esta URL y la referencia en CSS.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Punto de entrada del juego -->
  <script type="module" src="/src/main.js"></script>

  <!-- Registrar controles touch -->
  <script type="module">
    import { touchPress, touchRelease } from '/src/engine/input.js';

    // Detectar si es un dispositivo táctil
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.getElementById('touchControls').style.display = 'block';
    }

    function addTouchBtn(id, action, isHeld = true) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', e => { e.preventDefault(); touchPress(action); });
      if (isHeld) btn.addEventListener('touchend',   e => { e.preventDefault(); touchRelease(action); });
    }

    addTouchBtn('btn-left',    'l');
    addTouchBtn('btn-right',   'r');
    addTouchBtn('btn-up',      'u',  false); // salto: pulse, no held
    addTouchBtn('btn-down',    'd');
    addTouchBtn('btn-punch',   'p',  false);
    addTouchBtn('btn-kick',    'k',  false);
    addTouchBtn('btn-guard',   'g');
    addTouchBtn('btn-special', 'sp', false);
  </script>

</body>
</html>
