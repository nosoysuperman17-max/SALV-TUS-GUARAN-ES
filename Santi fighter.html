<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#0a2420;color:#fff;font-family:'Press Start 2P',monospace,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px}
h1{font-size:clamp(16px,5vw,26px);color:#f5d03b;text-align:center;margin:0 0 4px;line-height:1.4}
p.sub{font-size:8px;color:#9cb;text-align:center;margin:0}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;width:100%;max-width:640px}
a.card{flex:1 1 260px;max-width:300px;text-decoration:none;color:#fff;border:3px solid;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;transition:transform .12s}
a.card:hover,a.card:active{transform:translateY(-4px)}
a.g{background:#14463d;border-color:#2fd2a4}
a.f{background:#2a1230;border-color:#ff4d6d}
.ico{font-size:44px}
.t{font-size:13px;line-height:1.5}
.g .t{color:#f5d03b}.f .t{color:#ff8fb1}
.d{font-size:7px;line-height:1.8;color:#cde}
.go{font-size:9px;margin-top:4px}
.g .go{color:#2fd2a4}.f .go{color:#ff4d6d}
footer{font-size:6px;color:#7aa;text-align:center}
</style></head><body>
<div>
  <h1>ELEGÍ TU JUEGO</h1>
  <p class="sub">Tocá uno para jugar</p>
</div>
<div class="cards">
  <a class="card g" href="guaranies.html">
    <div class="ico">💰</div>
    <div class="t">SALVÁ TUS<br>GUARANÍES</div>
    <div class="d">Atrapá billetes antes de que el banco los lave. Con ranking.</div>
    <div class="go">▶ JUGAR</div>
  </a>
  <a class="card f" href="santi-fighter.html">
    <div class="ico">🥊</div>
    <div class="t">SANTI<br>FIGHTER</div>
    <div class="d">Juego de peleas arcade. Usalo con el celular en horizontal.</div>
    <div class="go">▶ JUGAR</div>
  </a>
</div>
<footer>Parodias ficticias. Cualquier parecido es coincidencia.</footer>
</body></html>
