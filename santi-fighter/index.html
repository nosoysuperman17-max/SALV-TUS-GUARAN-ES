<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Santi Fighters</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100vw;height:100vh;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Press Start 2P',monospace;color:#fff}
*{-webkit-text-size-adjust:none;text-size-adjust:none;}
html{touch-action:none;}
body{touch-action:none;-webkit-overflow-scrolling:none;overflow:hidden;}
#c{position:fixed;background:#000}
#ui{position:fixed;inset:0;pointer-events:none;display:none}
body.f #ui{display:block}
.b{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:2vh;opacity:.72;border:.5vh solid rgba(0,0,0,.55);box-shadow:0 .8vh 0 rgba(0,0,0,.5);color:#fff;text-shadow:0 .2vh #000}
.b.on{opacity:1;transform:translateY(.5vh);box-shadow:none}
.d{width:15vh;height:15vh;border-radius:2vh;background:#333;font-size:5vh}
.r{width:16vh;height:16vh;border-radius:50%}
#fat-btn{display:none;width:18vh;height:7vh;border-radius:1.5vh;background:linear-gradient(135deg,#8b0000,#ff0000);font-size:1.2vh;border:2px solid #ff6600}
body.f #fat-btn{display:flex}
#rot{display:none;position:fixed;inset:0;background:#000;z-index:9;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:2;padding:20px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="b d" data-k="u" style="left:18vh;bottom:31vh">▲</div>
  <div class="b d" data-k="l" style="left:3vh;bottom:16vh">◀</div>
  <div class="b d" data-k="r" style="left:33vh;bottom:16vh">▶</div>
  <div class="b d" data-k="d" style="left:18vh;bottom:1vh">▼</div>
  <div class="b r" data-k="p" style="right:30vh;bottom:6vh;background:#d22">PUÑO</div>
  <div class="b r" data-k="k" style="right:15vh;bottom:20vh;background:#e8b800">PATADA</div>
  <div class="b r" data-k="g" style="right:3vh;bottom:34vh;background:#26c">DEFENSA</div>
  <div class="b" id="fat-btn" data-k="fat" style="left:50%;transform:translateX(-50%);bottom:1vh">💀 FATALITY</div>
</div>
<div id="rot">GIRA TU CELULAR<br>A HORIZONTAL</div>
<script>
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const LW=900,LH=450,G=370,DT=1/60,ROUND_TIME=120,MAX_ROUNDS=2;
</script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body></html>
