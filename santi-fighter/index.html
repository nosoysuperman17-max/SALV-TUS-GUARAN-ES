*{-webkit-text-size-adjust:none;text-size-adjust:none;box-sizing:border-box}
html,body{margin:0;padding:0;width:100vw;height:100vh;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Press Start 2P',monospace;color:#fff}
html,body{touch-action:none;-webkit-overflow-scrolling:none;}

/* Canvas — full screen, sin barras */
#c{position:fixed;top:0;left:0;image-rendering:pixelated;}

/* Pantalla de inicio */
#splash{position:fixed;inset:0;background:#0a0a1a;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
#splash h1{font-size:clamp(18px,6vw,32px);color:#ffd400;margin:0;line-height:1.4}
#splash h2{font-size:clamp(10px,3vw,18px);color:#ff3b3b;margin:0}
#splash .hint{font-size:9px;color:#aaa;line-height:2}
#splash .rot-hint{font-size:9px;color:#ffd400;line-height:2}
#splash button{margin-top:8px;padding:16px 32px;font-family:'Press Start 2P',monospace;font-size:12px;background:#ff3b3b;color:#fff;border:3px solid #ffd400;border-radius:8px;cursor:pointer;touch-action:manipulation}

/* UI overlay — cubre toda la pantalla */
#ui{position:fixed;inset:0;pointer-events:none;display:none}
body.f #ui{display:block}

/* === D-PAD BASE — fondo circular decorativo === */
#dpad-bg{
  position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(60,60,80,.55) 0%,rgba(20,20,30,.7) 100%);
  border:2px solid rgba(255,255,255,.12);
  box-shadow:0 0 18px rgba(0,0,0,.7) inset,0 2px 8px rgba(0,0,0,.5);
  z-index:0;
}
/* Cruz interna decorativa del dpad */
#dpad-bg::before,#dpad-bg::after{
  content:'';position:absolute;background:rgba(255,255,255,.06);border-radius:4px;
}
#dpad-bg::before{left:33%;right:33%;top:0;bottom:0;}
#dpad-bg::after{top:33%;bottom:33%;left:0;right:0;}

/* === BOTONES BASE === */
.b{
  position:absolute;pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:'Press Start 2P',monospace;
  transition:opacity .08s,transform .08s;z-index:1;
}
.b.on{opacity:1!important;transform:scale(.92)!important;filter:brightness(1.4);}

/* === D-PAD — flechas con forma triangular === */
.d{
  opacity:.85;border:none;background:transparent;
}
/* Triángulos con clip-path — cada flecha apunta en su dirección */
#btn-u{clip-path:polygon(50% 8%,92% 88%,8% 88%);background:rgba(220,220,255,.22);}
#btn-d{clip-path:polygon(50% 92%,8% 12%,92% 12%);background:rgba(220,220,255,.22);}
#btn-l{clip-path:polygon(8% 50%,88% 8%,88% 92%);background:rgba(220,220,255,.22);}
#btn-r{clip-path:polygon(92% 50%,12% 92%,12% 8%);background:rgba(220,220,255,.22);}
.d:active,.d.on{background:rgba(255,255,255,.55)!important;}

/* Diagonales — zonas invisibles en las esquinas */
.dg{opacity:0;background:transparent;border:none;border-radius:0;}

/* === BOTONES DE ACCION — estilo consola === */
.r{
  border-radius:50%;
  box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.25);
  font-size:1.6vmin;
  line-height:1.2;
  flex-direction:column;gap:1px;
  opacity:.9;
  border:none;
}
.r .ico{font-size:2.4vmin;line-height:1}
.r .lbl{font-size:1.1vmin;opacity:.85}

#btn-p{background:radial-gradient(circle at 40% 35%,#ff6666,#bb1111);color:#fff;}
#btn-k{background:radial-gradient(circle at 40% 35%,#ffe066,#b88000);color:#fff;}
#btn-g{background:radial-gradient(circle at 40% 35%,#5599ff,#1133aa);color:#fff;}
#btn-sp{
  background:radial-gradient(circle at 40% 35%,#cc55ff,#660099);color:#fff;
  display:none;animation:specpulse .6s infinite alternate;
}
body.spec #btn-sp{display:flex}
@keyframes specpulse{
  from{box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 10px #aa00ff88;}
  to{box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 24px #cc00ff,0 0 40px #8800ccaa;}
}

/* FATALITY */
#fat-btn{
  display:none;border-radius:12px;
  background:linear-gradient(135deg,#8b0000,#ff2200);
  border:2px solid #ff6600;white-space:nowrap;
  box-shadow:0 4px 0 #550000,0 0 16px #ff000066;
  font-size:1.4vmin;opacity:.95;
}
body.fat #fat-btn{display:flex}

/* === LANDSCAPE === */
@media (orientation:landscape){
  #dpad-bg{left:1.5vmin;bottom:1.5vmin;width:40vmin;height:40vmin;}
  .d{width:13vmin;height:13vmin;font-size:5.5vmin}
  .dg{width:10vmin;height:10vmin;}
  .r{width:14vmin;height:14vmin;}
  #fat-btn{width:18vmin;height:7vmin;font-size:1.3vmin}
  /* D-pad cross layout */
  #btn-u{left:15.5vmin;bottom:29.5vmin}
  #btn-l{left:1.5vmin;bottom:15.5vmin}
  #btn-r{left:29.5vmin;bottom:15.5vmin}
  #btn-d{left:15.5vmin;bottom:1.5vmin}
  /* Diagonales en las esquinas */
  #btn-ul{left:3vmin;bottom:28vmin}
  #btn-ur{left:28vmin;bottom:28vmin}
  #btn-dl{left:3vmin;bottom:3vmin}
  #btn-dr{left:28vmin;bottom:3vmin}
  /* Botones accion — layout diamante tipo PlayStation */
  #btn-g{right:15.5vmin;bottom:29vmin}
  #btn-p{right:1.5vmin;bottom:15.5vmin}
  #btn-k{right:15.5vmin;bottom:2vmin}
  #btn-sp{right:29vmin;bottom:15.5vmin}
  #fat-btn{left:50%;transform:translateX(-50%);bottom:1vmin}
}

/* === PORTRAIT === */
@media (orientation:portrait){
  #dpad-bg{left:1.5vw;bottom:1.5vw;width:50vw;height:50vw;}
  .d{width:16vw;height:16vw;font-size:7vw}
  .dg{width:12vw;height:12vw;}
  .r{width:17vw;height:17vw;font-size:2.4vw}
  .r .ico{font-size:4vw}
  .r .lbl{font-size:1.6vw}

  #btn-g{right:18vw;bottom:35vw}
  #btn-p{right:2vw;bottom:18vw}
  #btn-k{right:18vw;bottom:1.5vw}
  #btn-sp{right:36vw;bottom:18vw}
  #fat-btn{left:50%;transform:translateX(-50%);bottom:0}
}

  else if(t=='hit'){osc(300,'square',.06,.2);osc(150,'sawtooth',.1,.1)}
  else if(t=='fatality'){
    // Trueno oscuro + bajo profundo + golpe siniestro

    const bufLen=Math.floor(AC.sampleRate*2.5);

    const nGain=AC.createGain();
    nGain.gain.setValueAtTime(1.0,AC.currentTime);
    nGain.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+2.5);
    noise.connect(nFilter);nFilter.connect(nGain);nGain.connect(dst);
    noise.start(AC.currentTime);noise.stop(AC.currentTime+2.5);

      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d+2.0);

    const m=AC.createOscillator(),mg=AC.createGain();

    g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+1.3);
    o.connect(g);g.connect(dst);o.start();o.stop(AC.currentTime+1.3);
  }
  else if(t=='fire'){// fuego crepitante
    if(!AC)return;
    const buf=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.3));

    });

// === PHYSICS ===
const LV=[.55,.68,.82,.95];
function mk(ci,x,face){
  const c=D.c[ci];
  return{c,x,y:0,vx:0,vy:0,face,hp:800,mh:800,st:'idle',t:0,wind:.12,
    atk:0,lastAtk:0,at:0,plan:'',air:false,type:'p',idx:0,_ci:ci,_dizzy:false,_dizzyT:0,_stunned:false,_stunnedT:0,_jumps:0}
}

function setS(f,s){
  if(f.st==s)return;
  f.st=s;f.t=0;
  if(s=='atk'){f.wind=.12;f.atk=.32;f.air=f.y<0}
}

function phys(f){
  f.y+=f.vy*DT;
  if(f.y>=0){
    f.y=0;f.air=false;
    if(f._koFlight){
      // Golpe con el suelo: rebote bajo y fricción
      if(f.vy>200){shake=Math.max(shake,10);snd('ko');}
      f.vy=-(f.vy*0.18); // mini rebote
      f.vx*=0.5;
      if(Math.abs(f.vy)<20){
        f.vy=0;f._koFlight=false;
        // Si es round de fatality, el personaje se para mareado
        if(f._koFat){
          f._dizzy=true;f._dizzyT=0; // se para y queda mareado con estrellitas
          f._dizzyPermanent=true; // no expira hasta que comience el fatality
        }
      }
    } else {
      f.vy=0;
      if(f._jumps>0)f._jumps=0;
    }
  } else {
    f.vy+=1600*DT;f.air=true;
  }
  f.x=Math.max(Math.round(LW*0.067),Math.min(Math.round(LW*0.933),f.x+f.vx*DT));
  if(f.st!='walk'&&f.st!='jump')f.vx*=.65;
  f.t+=DT;
}

function hitbox(f){
  return{x:f.x-(f.face>0?30:60),y:G+f.y-180,w:90,h:180}
}

function atkbox(f){
  const r=f.face>0;
  return{x:f.x+(r?20:-80),y:G+f.y-140,w:80,h:100}
}

function overlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y
}

function strike(f,o){
  if(f.st!='atk'||f.t<f.wind||f.t>f.atk)return;
  if(bl-f.lastAtk<0.18)return;
  if(!overlap(atkbox(f),hitbox(o)))return;
  f.lastAtk=bl;
  const bl_=o.st=='guard';
  const dmg=bl_?4:15+Math.random()*12|0;
  o.hp=Math.max(0,o.hp-dmg);
  sp.push({x:(f.x+o.x)/2,y:G+Math.min(f.y,o.y)-120,b:bl_,t:0});
  shake=bl_?4:9;

  // Combo management + spec bar fill
  if(f===P&&!bl_){
    // Jugador encajó golpe — combo consecutivo
    const timeSinceLast=bl-P.lastAtk;
    if(timeSinceLast<0.6){comboCount++;comboTimer=1.8;}
    else{comboCount=1;comboTimer=1.8;}
    if(comboCount>=3)comboStr=comboCount>=8?'BRUTAL!!':comboCount>=5?'IMPARABLE!':'COMBO!';
    // Score for hit
    playerScore+=1000;
    // specBar carga SOLO con golpes encajados consecutivos — cada golpe suma más si es en racha
    if(!specReady){
      const gain=8+(comboCount*4); // base 12, +4 por golpe en racha (máx ~40 en racha larga)
      specBar=Math.min(100,specBar+gain);
      if(specBar>=100){specReady=true;snd('fatbar');}
    }
    snd(f.type=='k'?'kick':'punch');
  } else if(f===E&&!bl_){
    // Enemigo golpeó al jugador — PIERDE TODA la barra especial del jugador
    comboCount=0;comboStr='';comboTimer=0;
    if(!specReady&&specBar>0){
      specBar=0; // se pierde toda la carga al recibir golpe
      shake=Math.max(shake,6);
    }
    // Enemigo carga su propia barra
    if(!specReadyE){
      specBarE=Math.min(100,specBarE+10);
      if(specBarE>=100){specReadyE=true;}
    }
    snd('hit');
  }

  if(!bl_)setS(o,'hit');
}

// Helper: apply stun to enemy after special hit
function stunEnemy(dur){
  if(!E||E.st=='ko')return;
  E._stunned=true;E._stunnedT=dur;E._stunnedFlash=0;
  setS(E,'hit');
}

// === SPECIAL ATTACK ===
function doSpecial(){
  if(!specReady||!P||!E)return;
  specReady=false;specBar=0;
  specProjs=[];
  const ci=me; // character index del jugador
  const _specAttacker=P; // quien lanza (referencia estable para closures)
  const _specTarget=E;   // quien recibe (referencia estable para closures)
  setS(P,'atk');
  snd('punch');
  // D.c order: [0=LINO-O, 1=ESGAY, 2=CARTER, 3=SANTI, 4=VAZQUEZ]
  switch(ci){
    case 1:{ // ESGAY (me=1): GRITO BRUTAL — onda expansiva que sacude TODO
      snd('dizzy');
      shake=20;
      specFlash('#ff88ff',0.18);
      // Onda expansiva grande que crece desde Esgay hacia el enemigo
      specProjs.push({x:P.x,y:G-100,vx:P.face*280,vy:0,type:'scream',t:0,life:1.5,dmg:80,r:0,_ownerP:_specAttacker});
      // Daño inmediato al ENEMIGO si está cerca (nunca al atacante)
      if(_specTarget&&_specTarget.st!='ko'&&Math.abs(_specTarget.x-P.x)<120){
        _specTarget.hp=Math.max(0,_specTarget.hp-50);
        shake=25;
        _specTarget._stunned=true;_specTarget._stunnedT=1.1;_specTarget._stunnedFlash=0;setS(_specTarget,'hit');
      }
      break;
    }
    case 2:{ // CARTER (me=2): BOTELLA DE WHISKY GRANDE + llamas
      snd('fire');
      shake=14;
      specFlash('#ff8800',0.14);
      // 1 botella grande muy visible con mucho daño
      specProjs.push({x:P.x+P.face*20,y:G-120,vx:P.face*520,vy:-20,
        type:'whisky',t:0,life:1.8,dmg:90,_big:true,_ownerP:_specAttacker});
      // 2 botellas secundarias
      for(let i=0;i<2;i++){
        specProjs.push({x:P.x+P.face*20,y:G-80-i*35,vx:P.face*440+i*40,vy:-40+i*25,
          type:'whisky',t:0,life:1.6,dmg:35,_ownerP:_specAttacker});
      }
      break;
    }
    case 3:{ // SANTI (me=3): LLAMADA Y MISIL RÁPIDO — abanico de facturas
      snd('missile');
      shake=12;
      specFlash('#00ffff',0.14);
      // Abanico de 8 billetes con más daño
      for(let i=0;i<8;i++){
        const ang=(i/8)*Math.PI*0.7-Math.PI*0.35;
        specProjs.push({x:P.x+P.face*30,y:G-110,vx:P.face*480*Math.cos(ang),vy:-280*Math.sin(ang)-120,
          type:'bill',t:0,life:2.2,dmg:35,_ownerP:_specAttacker});
      }
      // Después de 0.4s: congelar enemigo (usar _specTarget, no E — puede haber swap de IA)
      const _enemySanti=_specTarget;setTimeout(()=>{if(_enemySanti&&_enemySanti.st!='ko'){_enemySanti._stunned=true;_enemySanti._stunnedT=1.0;_enemySanti._stunnedFlash=0;setS(_enemySanti,'hit');}},400);
      break;
    }
    case 4:{ // VAZQUEZ (me=4): LLUVIA DE PLATA MASIVA desde arriba
      snd('fatbar');
      shake=16;
      specFlash('#ffd700',0.16);
      // 14 billetes lluvia desde lo alto, mucho daño acumulado
      for(let i=0;i<14;i++){
        specProjs.push({x:120+Math.random()*660,y:G-220-Math.random()*120,
          vx:(Math.random()-.5)*160,vy:160+Math.random()*140,
          type:'bill',t:Math.random()*0.3,life:2.5,dmg:28,_ownerP:_specAttacker});
      }
      // Congelar después de 0.5s (usar _specTarget, no E — puede haber swap de IA)
      const _enemyVaz=_specTarget;setTimeout(()=>{if(_enemyVaz&&_enemyVaz.st!='ko'){_enemyVaz._stunned=true;_enemyVaz._stunnedT=1.1;_enemyVaz._stunnedFlash=0;setS(_enemyVaz,'hit');}},500);
      break;
    }
    case 0:{ // LINO-O (me=0): CABALLO PIXELART A TODO GALOPE
      specFlash('#885500',0.12);
      shake=20;
      snd('punch');
      const hDir=P.face>0?1:-1;
      specProjs.push({x:hDir>0?-80:LW+80,y:G-55,vx:hDir*700,vy:0,
        type:'horse_img',t:0,life:2.0,dmg:140,face:hDir,_hit:false,_ownerP:P});
      // No congelar al atacante — solo pose breve de ataque

    }
  }
}

function updateSpecProjs(){
  for(let i=specProjs.length-1;i>=0;i--){
    const p=specProjs[i];
    p.t+=DT;
    p.x+=p.vx*DT;
    if(p.type!='scream'&&p.type!='flash_screen')p.y+=p.vy*DT;
    // gravity for bills and whisky
    if(p.type=='bill'||p.type=='whisky')p.vy+=300*DT;
    // scream expands
    if(p.type=='scream'){p.r=(p.r||0)+320*DT;}
    // horse stays on ground
    if(p.type=='horse'||p.type=='horse_img')p.y=G;
    // flash_screen: no movement, just visual
    if(p.type=='flash_screen'){if(p.t>p.life)specProjs.splice(i,1);continue;}
    // Hit check: proyectiles del jugador golpean al enemigo; del enemigo al jugador
    // _ownerP: referencia al atacante real (evita auto-daño)
    const _target=p._fromEnemy?P:E;
    const _stun=p._fromEnemy?(t,s)=>{if(P&&P.st!='ko'){P._stunned=true;P._stunnedT=t;setS(P,s||'hit');}}
                             :(t,s)=>{stunEnemy(t);setS(E,s||'hit');};
    // No golpear al propio atacante
    if(p._ownerP&&_target===p._ownerP){if(p.t>p.life)specProjs.splice(i,1);continue;}
    if(_target&&_target.st!='ko'){
      let hit=false;
      if(p.type=='scream'){
        const dist=Math.abs(_target.x-p.x);
        if(dist<(p.r||0)&&dist>0)hit=true;
      } else if(p.type=='horse_img'){
        const ex=_target.x;
        if(Math.abs(p.x-ex)<100&&!p._hit)hit=true;
      } else {
        const ex=_target.x,ey=G+_target.y-120;
        if(Math.abs(p.x-ex)<70&&p.y>ey&&p.y<ey+180)hit=true;
      }
      if(hit&&!p.hit){
        p.hit=true;
        p._hit=true;
        _target.hp=Math.max(0,_target.hp-p.dmg);
        shake=14;
        sp.push({x:p.x,y:p.y,b:false,t:0});
        snd('hit');
        if(p.type=='scream'){_stun(1.0);setS(_target,'hit');}
        else if(p.type=='horse_img'){_stun(1.2);setS(_target,'hit');shake=22;}
        else if(p._big){_stun(1.0);setS(_target,'hit');shake=18;}
        else{setS(_target,'hit');}
        if(p.type!='scream'&&p.type!='horse_img')specProjs.splice(i,1);
        continue;
      }
    }
    if(p.t>p.life)specProjs.splice(i,1);
  }
}

function drawSpecProjs(){
  specProjs.forEach(p=>{
    ctx.save();
    // Flash de pantalla completa al activar special
    if(p.type=='flash_screen'){
      const a=Math.max(0,0.55*(1-p.t/p.life));
      ctx.fillStyle=p.col.replace(')',`,${a})`).replace('rgb(','rgba(').replace('#',
        (m)=>{const r=parseInt(p.col.slice(1,3),16),g2=parseInt(p.col.slice(3,5),16),b=parseInt(p.col.slice(5,7),16);
          return `rgba(${r},${g2},${b},`;});
      // hack simple: usar fillStyle con alpha
      ctx.globalAlpha=a;
      ctx.fillStyle=p.col;
      ctx.fillRect(0,0,LW,LH);
      ctx.globalAlpha=1;
      ctx.restore();return;
    }
    if(p.type=='whisky'){
      // Si es el proyectil grande, lo dibujamos MUY grande y vistoso
      const sz=p._big?5.0:1;
      ctx.translate(p.x,p.y);ctx.rotate(p.t*2.5);
      if(p._big){
        // Glow effect para la botella grande
        ctx.shadowColor='#ff8800';ctx.shadowBlur=30;
      }
      if(FAT_IMGS&&FAT_IMGS.whisky&&FAT_IMGS.whisky.complete){
        ctx.drawImage(FAT_IMGS.whisky,-14*sz,-28*sz,28*sz,56*sz);
      } else {
        ctx.fillStyle=p._big?'#ff8800':'#cc8800';
        ctx.beginPath();ctx.ellipse(0,0,8*sz,20*sz,0,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;
      // trail de fuego más grande para botella grande
      ctx.globalAlpha=p._big?0.7:0.4;ctx.fillStyle='#ff6600';
      ctx.beginPath();ctx.ellipse(-p.vx*DT*4,-p.vy*DT*4,p._big?18:5,p._big?36:12,Math.atan2(p.vy,p.vx),0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    } else if(p.type=='bill'){
      // Billete verde más visible
      ctx.fillStyle='#1aab30';ctx.strokeStyle='#ffd700';ctx.lineWidth=1.5;
      ctx.fillRect(p.x-18,p.y-9,36,18);ctx.strokeRect(p.x-18,p.y-9,36,18);
      ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
      ctx.fillText('$$$',p.x,p.y+4);
    } else if(p.type=='scream'){
      const a=Math.max(0,0.7*(1-p.t/p.life));
      // Onda exterior
      ctx.strokeStyle=`rgba(255,0,220,${a})`;
      ctx.lineWidth=5+p.r*0.04;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
      // Onda interior
      ctx.strokeStyle=`rgba(255,180,255,${a*0.6})`;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.6,0,Math.PI*2);ctx.stroke();
      // Onda pequeña interior
      ctx.strokeStyle=`rgba(255,255,255,${a*0.3})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.3,0,Math.PI*2);ctx.stroke();
      // Texto de grito
      if(p.t<0.5){
        ctx.font='bold 20px sans-serif';ctx.fillStyle=`rgba(255,0,200,${a})`;
        ctx.textAlign='center';
        ctx.fillText('¡¡AAAAAHHH!!',p.x,p.y-p.r-14);
        ctx.font='bold 14px sans-serif';ctx.fillStyle=`rgba(255,200,255,${a*0.7})`;
        ctx.fillText('💥 GRITO MORTAL 💥',p.x,p.y-p.r-30);
      }
    } else if(p.type=='horse'||p.type=='horse_img'){
      // Horse pixel art GIF — grande, pies en el suelo
      const hw=280,hh=196;
      ctx.save();
      if(p.face<0||p.vx<0){ctx.scale(-1,1);ctx.drawImage(FAT_IMGS.horse_img,-(p.x+hw/2),p.y-hh,hw,hh);}
      else if(FAT_IMGS.horse_img&&FAT_IMGS.horse_img.complete){
        ctx.drawImage(FAT_IMGS.horse_img,p.x-hw/2,p.y-hh,hw,hh);
      }
      ctx.restore();
      // dust cloud at ground
      ctx.globalAlpha=0.4;ctx.fillStyle='#c8a060';
      for(let d=0;d<4;d++){
        ctx.beginPath();ctx.ellipse(p.x-(p.vx>0?1:-1)*(d+1)*22,p.y-4,14+d*5,8,0,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();
  });
}

function upd(f,o,I){
  // KO/win: solo aplicar física (caída) si está en el aire — nunca congelar en el aire
  if(f.st=='ko'||f.st=='win'){
    if(f.air||f.y<0)phys(f); // sigue cayendo hasta la base
    return;
  }
  // Stun (congelado por special): no puede moverse ni atacar PERO sigue cayendo si está en el aire
  if(f._stunned){
    f._stunnedT-=DT;
    if(f._stunnedT<=0){f._stunned=false;setS(f,'idle');}
    // Efecto visual: parpadeo
    f._stunnedFlash=(f._stunnedFlash||0)+DT;
    if(f.air||f.y<0)phys(f); // cae al suelo aunque esté stunned
    return; // no procesa input mientras stunned
  }
  strike(f,o);
  if(f.st=='hit'&&f.t>.18)setS(f,'idle');
  if(f.st=='atk'&&f.t>f.atk)setS(f,'idle');
  if(f.st=='jump'&&f.y>=0)setS(f,'idle');
  if(f.st=='ko')return;
  const mv=(I.r?1:0)-(I.l?1:0),back=mv*f.face<0;
  // Guard: activar SOLO mientras se mantiene presionado, sin freeze
  if(I.g&&f.st!='jump'&&f.st!='atk'){
    if(f.st!='guard'){setS(f,'guard');}
    f.vx=0;
    phys(f);return; // early return: personaje bloqueando
  }
  // Soltar guardia inmediatamente cuando se suelta el botón
  if(f.st=='guard'){setS(f,'idle');}
  if(f.st=='idle'||f.st=='walk'||f.st=='crouch'){
    // Jump and attack can happen simultaneously
    if(I.u&&f._jumps<2){ // máximo doble salto
      setS(f,'jump');f.vy=-720;f.vx=mv*200*f.sp;f._jumps=(f._jumps||0)+1;
    }
    if((I.p||I.k)&&f.st!='atk'){setS(f,'atk');f.type=I.k?'k':'p';f.idx=0;}
    else if(I.d&&!I.u&&f.st!='jump'){setS(f,'crouch');}
    else if(f.st!='jump'&&f.st!='atk'){
      if(mv){setS(f,'walk');f.vx=mv*(back?120:170)*f.face*f.face;}
      else setS(f,'idle');
    }
    if(f.st!='walk'&&f.st!='jump'&&f.st!='atk')f.vx=0;
  }else if(f.st=='jump'){
    // Double jump from jump state
    if(I.u&&f._jumps<2){f.vy=-680;f._jumps=(f._jumps||0)+1;}
    // Can attack while in air
    if((I.p||I.k))setS(f,'atk');
  }
  phys(f);
}

function ai(f,o,L){
  const I={},dx=o.x-f.x,d=Math.abs(dx),to=dx>0?'r':'l',aw=dx>0?'l':'r';
  f.at-=DT;

  if(!f._aiMode)f._aiMode='fight';
  if(!f._aiModeT)f._aiModeT=0;
  f._aiModeT-=DT;

  const hpPct=f.hp/f.mh;
  // Aggression: scales with L and fight index
  const aggr=Math.min(0.55+L*0.09+fi*0.07,0.95);

  // Use special when ready — high priority
  if(specReadyE&&f===E&&f._aiMode!='special'){
    if(Math.random()<0.08+0.12*L){
      f._aiMode='special';f._aiModeT=0.4;
    }
  }

  if(f._aiModeT>0){
    if(f._aiMode=='retreat'){
      I[aw]=1;
      if(o.st=='atk'&&d<150&&Math.random()<0.25)I.g=1;
      return I;
    }
    if(f._aiMode=='guard'){
      I.g=1;
      return I;
    }
    if(f._aiMode=='special'){
      if(d>90){I[to]=1;}
      else{I.sp=1;f._aiMode='fight';f._aiModeT=0;}
      return I;
    }
  }

  // Decide next action
  if(f.at<=0){
    f.at=0.02+Math.random()*0.08*(1.1-L*0.3);
    const r=Math.random();
    const beingAttacked=o.st=='atk'&&d<160;
    const lowHp=hpPct<0.25;

    if(specReadyE&&f===E&&r<0.3+0.35*L){
      f._aiMode='special';f._aiModeT=0.3+Math.random()*0.3;
    }
    // Rarely retreat (only low hp or getting hit badly)
    else if((beingAttacked&&r<0.12)||(lowHp&&r<0.08)){
      f._aiMode='retreat';f._aiModeT=0.2+Math.random()*0.25;
    }
    // Rarely guard
    else if(beingAttacked&&r<0.18){
      f._aiMode='guard';f._aiModeT=0.15+Math.random()*0.2;
    }
    else{
      // FIGHT: default — close in and attack relentlessly
      f._aiMode='fight';
      if(d>240){
        f.plan=r<0.85?'a':'j';
      } else if(d>120){
        if(r<aggr*0.5)f.plan='p';
        else if(r<aggr*0.85)f.plan='k';
        else if(r<0.92)f.plan='j';
        else f.plan='a';
      } else {
        if(r<aggr*0.55)f.plan='p';
        else if(r<aggr*0.9)f.plan='k';
        else if(r<0.95)f.plan='j';
        else{f._aiMode='retreat';f._aiModeT=0.15;}
      }
    }
  }

  // Execute fight mode
  if(f._aiMode=='fight'){
    const p=f.plan;
    if(p=='a'||p==''){I[to]=1;}
    else if(p=='p'||p=='k'){I[p]=1;f.plan='a';}
    else if(p=='j'){I.u=1;I[to]=1;f.plan='a';}
  }
  return I;
}

// === ROUNDS ===
function startRound(){
  P=mk(me,Math.round(LW*0.31),1);E=mk(foes[fi],Math.round(LW*0.69),-1);
  P.sp=1;E.sp=1;
  P.hp=P.mh;E.hp=E.mh;
  tm=ROUND_TIME;sp=[];
  comboCount=0;comboTimer=0;comboStr='';
  fatPhase=0;fatBar=0;fatActive=false;fatParticles=[];fatTimer=0;
  fatElapsed=0;fatSeq=[];fatSeqIdx=0;fatHitCount=0;fatByEnemy=false;
  specBar=0;specReady=false;specBarE=0;specReadyE=false;specProjs=[];
  if(P){P._stunned=false;P._stunnedT=0;P._fatHidden=false;P._dizzy=false;P._dizzyT=0;}
  if(E){E._stunned=false;E._stunnedT=0;E._fatHidden=false;E._dizzy=false;E._dizzyT=0;}
  sc='intro';mt=1.8;
  msg='RONDA '+round+(foes[fi]===0?' - JEFE FINAL':'');
}

function startFight(){
  round=1;roundWinsP=0;roundWinsE=0;
  startRound();
}

// === FATALITY ===
function doFatality(){
  fatParticles=[];
  fatElapsed=0;fatSeqIdx=0;fatHitCount=0;
  const actor=fatByEnemy?E:P;   // quien hace el fatality
  const victim=fatByEnemy?P:E;  // quien lo recibe
  const ci=fatByEnemy?E._ci:me; // índice del personaje que actúa

  // Bajar víctima al piso si estaba en el aire
  victim.y=0;victim.vy=0;victim.vx=0;victim.air=false;
  // Marear a la víctima
  victim._dizzy=true;victim._dizzyT=0;
  setS(victim,'idle');
  snd('dizzy');

  // D.c order: [0=LINO-O, 1=ESGAY, 2=CARTER, 3=SANTI, 4=VAZQUEZ]
  // me = chi = i<4 ? i+1 : 0  =>  me=1=ESGAY, me=2=CARTER, me=3=SANTI, me=4=VAZQUEZ, me=0=LINO-O
  switch(ci){
    case 1: { // ESGAY (me=1) — brutality: corre y pega 10 golpes rápidos seguidos
      fatSeq=[
        {t:0.1, a:'run'},
        {t:0.5, a:'hit'},{t:0.65,a:'kick'},{t:0.8, a:'hit'},
        {t:0.95,a:'hit'},{t:1.08,a:'kick'},{t:1.18,a:'hit'},
        {t:1.28,a:'hit'},{t:1.38,a:'kick'},{t:1.48,a:'hit'},
        {t:1.58,a:'hit'},{t:1.68,a:'slam'},{t:2.2, a:'pose'},
      ];
      break;
    }
    case 2: { // CARTER (me=2) — se aleja, arroja botella+puro → fuego consume víctima
      snd('whisky');
      fatSeq=[
        {t:0.0, a:'back_off'},
        {t:0.8, a:'pose'},
        {t:1.4, a:'throw_whisky'},
        {t:2.1, a:'throw_puro'},
        {t:3.0, a:'fire_start'},
        {t:5.5, a:'pose'},
      ];
      // Botella MUY GRANDE volando hacia base del oponente
      const bvx=actor.face>0 ? (victim.x-actor.x)/36 : (victim.x-actor.x)/36;
      fatParticles.push({
        x:actor.x+(actor.face>0?40:-40),y:G+actor.y-100,
        vx:bvx,vy:-1.5,targetX:victim.x,targetY:G+victim.y,
        t:0,delay:1.4,life:1.6,type:'whisky',col:'#cc8800',size:150,
        _hits:false,_big:true
      });
      // Puro grande volando después
      const pvx=actor.face>0 ? (victim.x-actor.x)/22 : (victim.x-actor.x)/22;
      fatParticles.push({
        x:actor.x+(actor.face>0?50:-50),y:G+actor.y-85,
        vx:pvx,vy:-0.5,targetX:victim.x,targetY:G+victim.y,
        t:0,delay:2.1,life:1.2,type:'puro',col:'#ff4400',size:80,
        _hits:false
      });
      // Fuego GRANDE que cubre toda la víctima desde la base (delay 3.0s)
      for(let i=0;i<12;i++){
        fatParticles.push({
          x:victim.x+(Math.random()-0.5)*60,y:G+victim.y+5,
          vx:(Math.random()-0.5)*0.5,vy:0,
          t:0,delay:3.0+Math.random()*0.3,life:3.8,
          type:'fire',col:'#ff6600',size:60+Math.random()*40,flicker:Math.random()*8
        });
      }
      break;
    }
    case 3: { // SANTI (me=3) — se aleja, llama, misil cae sobre oponente, gran explosión GIF
      snd('missile');
      fatSeq=[
        {t:0.0, a:'back_off'},
        {t:0.7, a:'phone_pose'},
        {t:2.2, a:'explosion_impact'},
        {t:4.0, a:'pose'},
      ];
      // Misil cae desde arriba directo sobre la víctima — desaparece al tocar base
      fatParticles.push({x:victim.x,y:-150,vx:0,vy:6,t:0,delay:1.0,life:3.5,
        type:'missile',col:'#888',size:44,_hideOnImpact:true});
      break;
    }
    case 4: { // VAZQUEZ (me=4) — lluvia de billetes + bolsazo aplasta y oponente desaparece
      fatSeq=[
        {t:0.0, a:'back_off'},
        {t:0.8, a:'pose'},
        {t:2.2, a:'explosion_impact'},
        {t:4.0, a:'pose'},
      ];
      // Lluvia de billetes
      for(let i=0;i<80;i++){
        fatParticles.push({
          x:Math.random()*900,y:-30-Math.random()*200,
          vx:(Math.random()-0.5)*2,vy:2.5+Math.random()*3,
          t:-Math.random()*0.8,life:7,type:'bill',
          col:i%3==0?'#90EE90':i%3==1?'#FFD700':'#4CAF50',
          size:18,rot:Math.random()*Math.PI*2
        });
      }
      // Bolsa cae lenta y grande, se queda en la base (_stayOnGround)
      fatParticles.push({x:victim.x,y:-180,vx:0,vy:4,t:0,delay:0.9,life:7,
        type:'moneybag',col:'#2d8a2d',size:95,_stayOnGround:true,_hideVictim:true});
      // Sangre salpicada al impactar
      for(let i=0;i<50;i++){
        fatParticles.push({
          x:victim.x+(Math.random()-0.5)*80,y:G+victim.y-10,
          vx:(Math.random()-0.5)*10,vy:-Math.random()*9-1,
          t:0,delay:2.2,life:2.5,type:'blood',col:'#cc0000',size:6+Math.random()*14
        });
      }
      break;
    }
    case 0: { // LINO-O — helicóptero entra, baja lento, rebota y cae sobre la víctima
      snd('heli');
      // Imagen del heli: cockpit a la IZQUIERDA
      // Viene desde la derecha (vx<0) → sin flip (cockpit mira izquierda=adelante)
      // Viene desde la izquierda (vx>0) → flip para que cockpit mire derecha
      const heliFromRight = actor.x > victim.x;
      const heliStartX = heliFromRight ? LW+200 : -200;
      const heliVX = heliFromRight ? -2.0 : 2.0;
      fatSeq=[
        {t:0.0, a:'back_off'},{t:0.4, a:'jump_exit'},
        {t:8.0, a:'explosion_impact'},{t:9.5, a:'pose'},
      ];
      // Helicóptero grande. delay:0.5 = aparece 0.5s después de iniciar fatality
      fatParticles.push({
        x:heliStartX, y:90,
        vx:heliVX, vy:0,
        t:0, delay:0.5, life:14,
        type:'heli_img',
        col:'#cc0000', size:290,
        _targetX:victim.x,
        _dead:false, _phase:0, _phaseT:0,
        _fromRight:heliFromRight,
        _boomTriggered:false
      });
      // Explosión, flash y debris — _waitBoom:true los mantiene inactivos
      // Se activan automáticamente cuando el heli impacta (ver updateFatParticles)
      fatParticles.push({
        x:victim.x, y:G-70, vx:0, vy:0,
        t:0, delay:9999, life:3.5,
        type:'explosion_gif', col:'#ff8800', size:380, _waitBoom:true
      });
      fatParticles.push({
        x:victim.x, y:G-50, vx:0, vy:0,
        t:0, delay:9999, life:0.6,
        type:'flash', col:'#ffffff', size:440, _waitBoom:true
      });
      for(let i=0;i<35;i++){
        fatParticles.push({
          x:victim.x+(Math.random()-0.5)*50, y:G-20,
          vx:(Math.random()-0.5)*14, vy:-Math.random()*10-3,
          t:0, delay:9999, life:2.2,
          type:'blood',
          col:i%3===0?'#cc0000':i%3===1?'#ff6600':'#888',
          size:6+Math.random()*12, _waitBoom:true
        });
      }
      break;
    }
    default: { // Fallback
      fatParticles.push({x:victim.x,y:-30,vx:0,vy:3.5,t:0,life:2.2,type:'missile',col:'#222',size:36});
      for(let i=0;i<25;i++){
        fatParticles.push({
          x:victim.x,y:G+victim.y-80,
          vx:(Math.random()-0.5)*6,vy:-Math.random()*5-1,
          t:0,delay:0.7,life:1.5,type:'explosion',
          col:i%2==0?'#ff8800':'#ffff00',size:12+Math.random()*22
        });
      }
    }
  }
  fatPhase=2;fatTimer=7.0;
  snd('fatality');
}

function spawnHitSparks(x,y,big){
  const cols=['#ff0000','#ff4400','#ff8800','#ffff00','#cc00ff','#ff0088'];
  const n=big?18:10;
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=(big?4:2)+Math.random()*(big?8:5);
    fatParticles.push({
      x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*20,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,
      t:0,delay:0,life:0.6+Math.random()*0.4,
      type:'rage',col:cols[i%cols.length],
      size:(big?12:7)+Math.random()*8
    });
  }
  // blood drops
  for(let i=0;i<(big?6:3);i++){
    fatParticles.push({
      x:x+(Math.random()-0.5)*15,y:y,
      vx:(Math.random()-0.5)*3,vy:-Math.random()*4,
      t:0,delay:0,life:1.2,type:'blood',
      col:'#cc0000',size:4+Math.random()*6
    });
  }
}

function updateFatSeq(){
  if(fatSeq.length===0)return;
  fatElapsed+=DT;
  const actor=fatByEnemy?E:P;
  const victim=fatByEnemy?P:E;
  while(fatSeqIdx<fatSeq.length && fatElapsed>=fatSeq[fatSeqIdx].t){
    const ev=fatSeq[fatSeqIdx];
    if(ev.a==='back_off'){
      // Actor retrocede lejos del rival
      actor.face=actor.x<victim.x?1:-1;
      const dist=actor.x<victim.x?-260:260;
      actor.x=Math.max(Math.round(LW*0.067),Math.min(Math.round(LW*0.933),victim.x+dist));
      setS(actor,'walk');
    } else if(ev.a==='run'){
      actor.face=actor.x<victim.x?1:-1;
      actor.x=victim.x+(actor.x<victim.x?-80:80);
      setS(actor,'walk');
    } else if(ev.a==='throw_whisky'||ev.a==='throw_puro'){
      // Actor poses as if throwing
      actor.face=actor.x<victim.x?1:-1;
      setS(actor,'atk');actor.type='p';actor.idx=0;actor.wind=0;actor.atk=0.5;
    } else if(ev.a==='jump_exit'){
      // Actor jumps up and exits screen (for Lino-O helicopter)
      setS(actor,'jump');actor.vy=-18;actor.vx=0;
      // Hide actor after jump
      actor._fatHidden=true;
    } else if(ev.a==='hit'||ev.a==='kick'){
      actor.face=actor.x<victim.x?1:-1;
      actor.x=victim.x+(actor.x<victim.x?-70:70);
      setS(actor,'atk');actor.type=ev.a==='kick'?'k':'p';actor.idx=fatHitCount%2;actor.wind=0;actor.atk=0.3;
      setS(victim,'ko');
      shake=8;snd('hit');fatHitCount++;
      spawnHitSparks(victim.x,G+victim.y-70,false);
      victim.x+=(actor.x<victim.x?8:-8);
      victim.x=Math.max(80,Math.min(820,victim.x));
    } else if(ev.a==='slam'){
      actor.face=actor.x<victim.x?1:-1;
      actor.x=victim.x+(actor.x<victim.x?-60:60);
      setS(actor,'atk');actor.type='k';actor.idx=0;actor.wind=0;actor.atk=0.5;
      setS(victim,'ko');
      shake=18;snd('ko');
      spawnHitSparks(victim.x,G+victim.y-60,true);
      for(let i=0;i<30;i++){
        const ang=Math.random()*Math.PI*2;
        fatParticles.push({
          x:victim.x+(Math.random()-0.5)*30,y:G+victim.y-60,
          vx:Math.cos(ang)*(3+Math.random()*7),vy:Math.sin(ang)*5-3,
          t:0,delay:0,life:1.5+Math.random(),
          type:'blood',col:i%2===0?'#cc0000':'#ff4400',size:5+Math.random()*10
        });
      }
    } else if(ev.a==='pose'){
      actor.face=actor.x<victim.x?1:-1;
      setS(actor,'win');setS(victim,'ko');
    } else if(ev.a==='explosion_impact'){
      shake=18;setS(victim,'ko');
      for(let i=0;i<20;i++){
        const ang=Math.random()*Math.PI*2;
        fatParticles.push({
          x:victim.x+(Math.random()-0.5)*30,y:G+victim.y-60,
          vx:Math.cos(ang)*(3+Math.random()*6),vy:Math.sin(ang)*5-3,
          t:0,delay:0,life:1.3+Math.random(),
          type:'blood',col:'#cc0000',size:5+Math.random()*9
        });
      }
    } else if(ev.a==='phone_pose'){
      // SANTI llama por teléfono — pose idle con "teléfono"
      actor.face=actor.x<victim.x?1:-1;
      setS(actor,'idle');
    } else if(ev.a==='fire_start'){
      setS(victim,'ko');shake=12;snd('fire');
    }
    fatSeqIdx++;
  }
}

function updateFatParticles(){
  const victim=fatByEnemy?P:E;
  fatParticles.forEach(p=>{
    p.t+=DT;
    if(p.t<(p.delay||0))return;
    const relT=p.t-(p.delay||0);
    if(p.type=='heli'){
      // Helicopter homes toward victim after 0.8s
      if(relT>0.8){
        p.vx+=(victim.x-p.x)*0.012;
        p.vy+=(G+victim.y-80-p.y)*0.012;
      }
      p.rot+=0.12;
      p.x+=p.vx;p.y+=p.vy;
      // Trigger explosion sound when near victim
      if(relT>1.5&&!p._boom&&Math.abs(p.x-victim.x)<80&&Math.abs(p.y-(G+victim.y-80))<80){
        p._boom=true;snd('ko');shake=20;
        setS(victim,'ko');
      }
    } else if(p.type=='heli_img'){
      // FASES: 0=cruza pantalla a media altura, 1=baja lento sobre víctima, 2=rebote up, 3=caída final
      if(!p._dead){
        p._phaseT=(p._phaseT||0)+DT;
        const tx=p._targetX||victim.x;
        // groundY = altura del suelo visible (G) ajustado por tamaño del heli
        const groundY=G-20;
        if(p._phase===0){
          // Fase 0: vuela horizontalmente hacia la X de la víctima, mantiene altura ~90
          p.x+=p.vx;
          // Suave estabilización de Y hacia 90
          p.y+=(90-p.y)*0.04;
          const dist=Math.abs(p.x-tx);
          if(dist<60){
            // Llegó encima de la víctima — para y empieza bajada lenta
            p._phase=1;p._phaseT=0;
            p.vx=0;p.vy=0.8;
          }
        } else if(p._phase===1){
          // Fase 1: baja lento, acelerando suavemente
          p.vy=Math.min(p.vy+0.06,3.5);
          p.y+=p.vy;
          if(p.y>=groundY){
            // Rebote en el suelo
            p.y=groundY;
            p._phase=2;p._phaseT=0;
            p.vy=-4.0;
          }
        } else if(p._phase===2){
          // Fase 2: rebota hacia arriba
          p.vy+=0.22;
          p.y+=p.vy;
          if(p.vy>=0){
            // Empieza a bajar de nuevo — caída final rápida
            p._phase=3;p._phaseT=0;
            p.vy=0;
          }
        } else if(p._phase===3){
          // Fase 3: caída final acelerada
          p.vy=Math.min(p.vy+0.5,15);
          p.y+=p.vy;
          if(p.y>=groundY&&!p._boom){
            p._boom=true;p._dead=true;
            snd('ko');shake=32;
            victim._fatHidden=true;
            setS(victim,'ko');
            // Activar todas las partículas en espera (_waitBoom)
            const now=p.t;
            fatParticles.forEach(q=>{
              if(q._waitBoom){q.delay=0;q.t=0;q._waitBoom=false;}
            });
          }
        }
      }
    } else if(p.type=='explosion_real'){
      // stays at position, just ages
    } else if(p.type=='bill'){
      p.x+=p.vx;p.y+=p.vy;
      p.rot+=0.05;
    } else if(p.type=='moneybag'){
      if(!p._boom){p.y+=p.vy;p.vy+=0.3;}
      // Al llegar a la base se queda ahí y aplasta
      if(!p._boom&&p.y>=G-p.size*0.4){
        p._boom=true;p.vy=0;p.vx=0;p._squash=true;
        p.y=G-p.size*0.15; // queda en la base
        snd('ko');shake=22;
        setS(victim,'ko');
        // Ocultar víctima — aplastada bajo la bolsa
        victim._fatHidden=true;
        // Sacudida extra de pantalla
        setTimeout(()=>{shake=Math.max(shake,15);},80);
        setTimeout(()=>{shake=Math.max(shake,10);},160);
      }
    } else if(p.type=='missile'){
      if(!p._boom){p.y+=p.vy;p.x+=p.vx;}
      if(!p._boom&&p.y>=G+victim.y-20){
        p._boom=true;p._hidden=true; // misil desaparece
        snd('ko');shake=24;
        setS(victim,'ko');
        victim._fatHidden=true; // oponente desaparece con la explosión
        // Explosión GIF GRANDE en la base
        fatParticles.push({x:victim.x,y:G-80,vx:0,vy:0,t:0,life:3.0,type:'explosion_gif',col:'#ff4400',size:220});
        fatParticles.push({x:victim.x,y:G-60,vx:0,vy:0,t:0,life:0.45,type:'flash',col:'#ffffff',size:380});
        for(let i=0;i<35;i++){
          fatParticles.push({
            x:victim.x+(Math.random()-0.5)*30,y:G-60,
            vx:(Math.random()-0.5)*11,vy:-Math.random()*10-2,
            t:0,life:2.0,type:'blood',col:'#cc0000',size:5+Math.random()*11
          });
        }
      }
    } else if(p.type=='bomb'){
      p.y+=p.vy;
      if(!p._boom&&p.y>=G+victim.y-80){
        p._boom=true;snd('ko');shake=20;
        setS(victim,'ko');
      }
    } else if(p.type=='puro'){
      p.x+=p.vx;p.y+=p.vy;
      // El puro cae hacia la base del oponente
      if(p.targetY!==undefined && p.y < p.targetY) p.vy += 0.15;
      if(!p._boom&&p.y>=G+victim.y-10){
        p._boom=true;p._hidden=true;snd('fire');
      }
    } else if(p.type=='whisky'){
      p.x+=p.vx;p.y+=p.vy;
      // La botella vuela con arco hacia la base del oponente
      if(p.targetY!==undefined && p.y < p.targetY) p.vy += 0.12;
      if(!p._boom&&p.y>=G+victim.y-5){
        p._boom=true;p._hidden=true;snd('hit');
      }
    } else if(p.type=='fire'){
      // Fuego estático sobre la víctima — oscilación vertical ligera
      p.y=G+victim.y+5+Math.sin(relT*(p.flicker||6))*4;
      // Oculta víctima cuando el fuego está activo
      if(!victim._fatHidden) victim._fatHidden=true;
    } else if(p.type=='flash'){
      // Static flash — no movement
    } else {
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;
    }
  });
}

function drawFatParticles(){
  fatParticles.forEach(p=>{
    const relT=p.t-(p.delay||0);
    if(relT<0)return;
    if(p._hidden)return; // ocultar partícula tras impacto
    // heli_img y moneybag no usan fade genérico — tienen su propio alpha
    const alpha=(p.type=='heli_img'||p.type=='moneybag')?1:Math.max(0,1-relT/p.life);
    ctx.globalAlpha=alpha;

    if(p.type=='bill'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.t*1.5);
      ctx.fillStyle='#1a5c1a';ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2+2,-p.size/4+2,p.size-4,p.size/2-4);
      ctx.fillStyle='#FFD700';ctx.font='9px sans-serif';ctx.textAlign='center';
      ctx.fillText('₲',0,3);ctx.restore();
    } else if(p.type=='moneybag'){
      // Bolsa de dinero — imagen real
      ctx.save();ctx.translate(p.x,p.y);
      if(p._squash){ctx.scale(1.8,0.35);} // aplastada al impactar
      const mbW=p.size*1.4,mbH=p.size*1.6;
      if(FAT_IMGS.moneybag&&FAT_IMGS.moneybag.complete){
        ctx.drawImage(FAT_IMGS.moneybag,-mbW/2,-mbH/2,mbW,mbH);
      } else {
        ctx.fillStyle='#8B7355';ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#FFD700';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('₲',0,8);
      }
      ctx.restore();
    } else if(p.type=='heli'){
      // Helicóptero — imagen real
      ctx.save();ctx.translate(p.x,p.y);
      // flip horizontal when moving left
      if(p.vx<0){ctx.scale(-1,1);}
      // slight tilt based on movement
      ctx.rotate(p.vx*0.015);
      const hw=p.size*1.4,hh=p.size*0.9;
      if(FAT_IMGS.helicopter&&FAT_IMGS.helicopter.complete){
        ctx.drawImage(FAT_IMGS.helicopter,-hw/2,-hh/2,hw,hh);
      } else {
        ctx.fillStyle='#cc0000';ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      }
      // fire trail behind heli
      if(p._boom){
        ctx.globalAlpha=0.8;
        if(FAT_IMGS.explosion&&FAT_IMGS.explosion.complete){
          ctx.drawImage(FAT_IMGS.explosion,-p.size*0.8,-p.size*0.8,p.size*1.6,p.size*1.6);
        }
      }
      ctx.restore();
    } else if(p.type=='heli_img'){
      // Helicóptero grande — imagen con cockpit a la IZQUIERDA
      // Flip si viene desde la izquierda (vx>0 o _fromRight=false) para que cockpit apunte hacia adelante
      if(!p._dead){
        ctx.save();ctx.translate(p.x,p.y);
        // Cockpit izquierda en imagen original → correcto si se mueve a la izquierda (vx<0 o phase>=1)
        // Si viene desde la izquierda (_fromRight=false), flipear para que cockpit apunte derecha
        const needsFlip = !p._fromRight; // viene desde izquierda → flip para que morro apunte derecha
        if(needsFlip)ctx.scale(-1,1);
        // Inclinación leve según velocidad vertical (cae un poco de punta)
        const tiltAngle=p._phase>=1?Math.min(p.vy*0.025,0.35):0;
        ctx.rotate(tiltAngle*(needsFlip?-1:1));
        const hw=p.size, hh=p.size*0.65;
        if(FAT_IMGS.heli_img&&FAT_IMGS.heli_img.complete){
          ctx.drawImage(FAT_IMGS.heli_img,-hw/2,-hh/2,hw,hh);
        } else {
          ctx.fillStyle='#cc0000';ctx.fillRect(-hw/2,-hh/4,hw,hh/2);
          ctx.fillStyle='#fff';ctx.fillRect(-hw/2,-hh/4,hw/3,hh/2); // "cockpit" izquierda
        }
        ctx.restore();
      }
    } else if(p.type=='explosion_real'){
      // Real explosion GIF - large, stays at impact point
      ctx.save();
      const ew=p.size,eh=p.size;
      if(FAT_IMGS.explosion_real&&FAT_IMGS.explosion_real.complete){
        ctx.drawImage(FAT_IMGS.explosion_real,p.x-ew/2,p.y-eh/2,ew,eh);
      } else {
        // Fallback: drawn explosion circles
        const alpha=Math.max(0,1-relT/p.life);
        ctx.globalAlpha=alpha;
        ctx.fillStyle='#ff8800';
        ctx.beginPath();ctx.arc(p.x,p.y,ew/2*alpha,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffff00';
        ctx.beginPath();ctx.arc(p.x,p.y,ew/4*alpha,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      ctx.restore();
    } else if(p.type=='missile'){
      // Misil — imagen real. La punta está ABAJO en la imagen original => dibujar sin rotación
      ctx.save();ctx.translate(p.x,p.y);
      const mw=p.size*1.1,mh=p.size*2.6;
      if(FAT_IMGS.missile&&FAT_IMGS.missile.complete){
        // Dibujar imagen tal cual — punta ya apunta abajo
        ctx.drawImage(FAT_IMGS.missile,-mw/2,-mh/2,mw,mh);
        // Llama del motor sale de la parte SUPERIOR (escudo/motor arriba en la imagen)
        ctx.globalAlpha=0.85+Math.random()*0.15;
        ctx.fillStyle='rgba(255,160,0,0.95)';
        ctx.beginPath();ctx.ellipse(0,-mh/2-12,11,22+Math.random()*14,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.6;ctx.fillStyle='rgba(255,240,80,0.8)';
        ctx.beginPath();ctx.ellipse(0,-mh/2-8,6,13+Math.random()*8,0,0,Math.PI*2);ctx.fill();
      } else {
        // Fallback: cuerpo gris, punta roja abajo, llama naranja arriba
        ctx.fillStyle='#999';ctx.fillRect(-7,-mh/2,14,mh);
        ctx.fillStyle='#cc3300';
        ctx.beginPath();ctx.moveTo(0,mh/2+16);ctx.lineTo(-8,mh/2);ctx.lineTo(8,mh/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 13px serif';ctx.textAlign='center';
        ctx.fillText('✡',0,4);
        ctx.globalAlpha=0.85;ctx.fillStyle='rgba(255,140,0,0.9)';
        ctx.beginPath();ctx.ellipse(0,-mh/2-10,9,20,0,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    } else if(p.type=='bomb'){
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#aaa';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(p.x,p.y-p.size);ctx.quadraticCurveTo(p.x+20,p.y-p.size-20,p.x+15,p.y-p.size-35);ctx.stroke();
      ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(p.x+15,p.y-p.size-35,5+Math.sin(p.t*20)*3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4169E1';ctx.font='bold '+(p.size*0.9)+'px serif';
      ctx.textAlign='center';ctx.fillText('✡',p.x,p.y+p.size*0.35);
    } else if(p.type=='explosion'||p.type=='explosion_gif'){
      // Explosión — imagen real GIF animada (explosion_gif usa boom GIF más grande)
      const gifImg = p.type=='explosion_gif' ? (FAT_IMGS.boom||FAT_IMGS.explosion) : FAT_IMGS.explosion;
      if(gifImg&&gifImg.complete){
        const scale = p.type=='explosion_gif' ? (1+relT/p.life*0.5) : (1-relT/p.life*0.3);
        const es=p.size*scale*2;
        ctx.save();ctx.translate(p.x,p.y);
        ctx.globalAlpha=p.type=='explosion_gif'?Math.max(0,1-relT/p.life*0.6):1;
        ctx.drawImage(gifImg,-es/2,-es/2,es,es);
        ctx.restore();
      } else {
        const r=p.size*(1-relT/p.life)*0.8+3;
        ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      }
    } else if(p.type=='fire'){
      // Fuego — GIF real, grande, arranca desde la BASE y sube
      // p.y ya está fijado en G+victim.y+5 (base del piso)
      if(FAT_IMGS.fire&&FAT_IMGS.fire.complete){
        const grow=Math.min(1,relT/0.5); // crece los primeros 0.5s
        const fw=p.size*3.2*grow,fh=p.size*2.8*grow;
        ctx.save();ctx.translate(p.x,p.y);
        // drawImage con origen en la base: arranca en y=0 (piso) y sube
        ctx.drawImage(FAT_IMGS.fire,-fw/2,-fh,fw,fh);
        ctx.restore();
      } else {
        const r=(p.size*(1-relT/p.life*0.4)+2);
        ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y-r*0.5,r,0,Math.PI*2);ctx.fill();
      }
    } else if(p.type==='blood'){
      const r=p.size*(1-relT/p.life)*0.6+1;
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(180,0,0,0.5)';
      ctx.beginPath();ctx.arc(p.x,p.y+r*0.8,r*0.5,0,Math.PI*2);ctx.fill();
    } else if(p.type==='flash'){
      const r=p.size*(1-relT/p.life);
      const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      g2.addColorStop(0,'rgba(255,255,255,0.9)');
      g2.addColorStop(1,'rgba(255,255,200,0)');
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    } else if(p.type==='puro'){
      // Puro — imagen real GRANDE, rotado en la dirección de vuelo
      ctx.save();ctx.translate(p.x,p.y);
      const ang=Math.atan2(p.vy,p.vx);
      ctx.rotate(ang);
      if(FAT_IMGS.cigar&&FAT_IMGS.cigar.complete){
        // Imagen original es horizontal (ancho > alto) — la dibujamos a lo largo del eje de movimiento
        const pw=p.size*2.4,ph=p.size*0.9;
        ctx.drawImage(FAT_IMGS.cigar,-pw*0.5,-ph/2,pw,ph);
      } else {
        ctx.fillStyle='#8B4513';ctx.fillRect(-p.size*1.2,-4,p.size*2.4,8);
        ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(p.size*1.2,0,5,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    } else if(p.type==='whisky'){
      // Botella de whisky GRANDE volando y girando
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*2.5);
      if(FAT_IMGS.whisky&&FAT_IMGS.whisky.complete){
        // Botella: más alta que ancha
        const bw=p.size*0.9,bh=p.size*2.2;
        ctx.drawImage(FAT_IMGS.whisky,-bw/2,-bh/2,bw,bh);
      } else {
        ctx.fillStyle='#cc8800';ctx.fillRect(-6,-p.size*1.1,12,p.size*2.2);
        ctx.fillStyle='#333';ctx.fillRect(-4,-p.size*1.1,8,p.size*0.3);
      }
      ctx.restore();
    } else {
      // rage / generic
      const r=p.size*(1-relT/p.life)*0.5+2;
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  });
}

// === FIN DE ROUND ===
function finRound(){
  stopBgMusic();
  let winner;
  if(E.hp<=0){winner='P';roundWinsP++;}
  else if(P.hp<=0){winner='E';roundWinsE++;}
  else{
    if(P.hp>E.hp){winner='P';roundWinsP++;}
    else if(E.hp>P.hp){winner='E';roundWinsE++;}
    else{winner='draw';}
  }
  roundResult=winner;

  // KO knockback: el perdedor sale volando
  const isFatRound=(winner=='P'&&roundWinsP>=2)||(winner=='E'&&roundWinsE>=2);
  if(winner=='P'){
    // Esgay sale volando al perder
    const dir=P.x<E.x?1:-1; // E vuela en dirección opuesta al jugador
    E.vx=dir*320; E.vy=-550; E.air=true;
    E._koFlight=true; E._koFat=isFatRound;
    setS(E,'ko');setS(P,'win');msg='K.O.';
  } else if(winner=='E'){
    const dir=E.x<P.x?1:-1;
    P.vx=dir*320; P.vy=-550; P.air=true;
    P._koFlight=true; P._koFat=isFatRound;
    setS(P,'ko');setS(E,'win');msg='K.O.';
  } else{msg='EMPATE';}

  shake=18;snd('ko');

  // Best-of-3: fatality SOLO cuando alguien ya tiene 2 victorias (ganó el match)
  if(winner=='P'&&roundWinsP>=2){
    // Jugador ganó el MATCH (2 victorias) — fatality del jugador
    // Esperar a que el vuelo KO termine antes de activar fatready
    fatByEnemy=false;
    fatPhase=0;fatBar=0;fatActive=true;fatTimer=4.5;
    sc='fatready';mt=1.5; // dar tiempo al vuelo dramático
  } else if(winner=='P'){
    // Jugador ganó este round pero no el match todavía
    round++;
    sc='roundend';mt=2.5;
  } else if(winner=='E'&&roundWinsE>=2){
    // Enemigo ganó el MATCH (2 victorias) — IA hace fatality
    fatByEnemy=true;
    fatPhase=0;fatBar=100;fatActive=true;fatTimer=0;
    fatElapsed=0;fatSeq=[];fatSeqIdx=0;fatHitCount=0;fatParticles=[];
    setS(P,'ko');setS(E,'win');
    sc='fatready';mt=1.5; // dar tiempo al vuelo dramático
  } else if(winner=='E'){
    // Enemigo ganó este round pero no el match todavía
    round++;
    sc='roundend';mt=2.5;
  } else {
    // Empate: siguiente round sin sumar victoria
    round++;
    sc='roundend';mt=2.5;
  }
}

// Called after fatality animation to check if fight continues
function afterFatality(){
  // Limpiar estado de mareo y stun PERO NO _fatHidden — la víctima debe seguir invisible
  if(P){P._dizzy=false;P._dizzyT=0;P._stunned=false;P._stunnedT=0;}
  if(E){E._dizzy=false;E._dizzyT=0;E._stunned=false;E._stunnedT=0;}
  if(fatByEnemy){
    // IA ganó el combate — jugador pierde
    fatByEnemy=false;
    sc='lose';mt=2;
    return;
  }
  if(roundWinsP>=2){
    // Jugador ganó el match — avanzar al siguiente enemigo
    playerScore+=10000;
    fi++;
    if(fi>=foes.length){
      const defeatedBoss=foes.includes(0);
      if(defeatedBoss){
        bossUnlocked=true; // solo en sesión, no localStorage
        goToRanking();
      } else {
        sc='win';mt=1;
      }
    } else {
      round=1;roundWinsP=0;roundWinsE=0;startRound();
    }
  }
}

// === STEP ===
function step(){
  bl+=DT;mt-=DT;
  if(comboTimer>0){comboTimer-=DT;if(comboTimer<=0){comboStr='';comboCount=0;}}

  document.body.classList.toggle('f',
    sc=='intro'||sc=='fight'||sc=='end'||sc=='roundend'||
    sc=='fatready'||sc=='fatality'||sc=='fatend'||sc=='ranking');
  document.body.classList.toggle('fat', sc=='fatready'&&!fatByEnemy);
  document.body.classList.toggle('spec', sc=='fight'&&specReady);

  if(sc=='intro'){
    upd(P,E,{});upd(E,P,{});
    if(mt<=0){sc='fight';startBgMusic();}
  }
  else if(sc=='fight'){
    tm-=DT;
    const I={l:K.l,r:K.r,u:T.u||0,d:K.d,g:K.g,p:T.p||T.pcombo,k:T.k||T.kcombo};
    T.p=T.k=T.pcombo=T.kcombo=T.u=0; // u se consume cada frame (flanco)
    if(T.sp){T.sp=0;doSpecial();}
    updateSpecProjs();
    upd(P,E,I);
    const aiI=ai(E,P,LV[Math.min(fi,3)]);
    // IA: especial del enemigo (usa el personaje del enemigo como actor)
    if(aiI.sp&&specReadyE&&E.st!='ko'){
      // Lanzar especial del enemigo: temporalmente swap P/E+vars para doSpecial
      const _P=P,_E=E,_me=me,_specReady=specReady,_specBar=specBar;
      const prevLen=specProjs.length;
      P=E;E=_P;me=P._ci; // el enemigo se convierte en "jugador" temporalmente
      specReady=true;specBar=100;
      doSpecial();
      P=_P;E=_E;me=_me; // restaurar
      specReady=_specReady;specBar=_specBar;
      specReadyE=false;specBarE=0; // consumir barra del enemigo
      // Marcar todos los nuevos proyectiles como "del enemigo" — deben golpear al jugador (P)
      for(let _i=prevLen;_i<specProjs.length;_i++){specProjs[_i]._fromEnemy=true;}
    }
    upd(E,P,aiI);
    // KO physics: siempre actualizar personajes ko para que caigan y animen correctamente
    if(P.st=='ko')phys(P);
    if(E.st=='ko')phys(E);
    // Auto-facing: ambos siempre miran al rival (excepto KO/win)
    if(P.st!='ko'&&P.st!='win'){P.face=P.x<E.x?1:-1;}
    if(E.st!='ko'&&E.st!='win'){E.face=E.x<P.x?1:-1;}
    // Keep fighters apart
    const dd=Math.abs(P.x-E.x);
    if(dd<80&&P.y>=0&&E.y>=0){const s=(80-dd)/2*(P.x<E.x?1:-1);P.x-=s;E.x+=s;}
    // specBar: baja lentamente si no estás golpeando
    if(!specReady&&specBar>0){specBar=Math.max(0,specBar-6*DT);}
    if(!specReadyE&&specBarE>0){specBarE=Math.max(0,specBarE-4*DT);}
    if(tm<=0){if(P.hp>=E.hp)E.hp=0;else P.hp=0;}
    if(P.hp<=0||E.hp<=0)finRound();
  }
  else if(sc=='roundend'){
    if(mt<=0){startRound();}
  }
  else if(sc=='fatready'){
    // KO physics in fatready state too
    if(P&&P.st=='ko')phys(P);
    if(E&&E.st=='ko')phys(E);
    // Don't call upd() here — HP is 0, would re-trigger finRound
    if(fatByEnemy){
      // IA hace el fatality automáticamente tras breve pausa
      if(mt<=0){doFatality();sc='fatality';mt=7.0;}
    } else {
      if(T.fat){
        fatBar=Math.min(100,fatBar+7);
        snd('fatbar');
        T.fat=0;
      }
      fatTimer-=DT;
      if(fatBar>=100){doFatality();sc='fatality';mt=7.0;}
      else if(fatTimer<=0){
        // Time expired — skip fatality, advance
        afterFatality();
      }
    }
  }
  else if(sc=='fatality'){
    updateFatSeq();
    updateFatParticles();
    if(mt<=0){sc='fatend';mt=1.8;}
  }
  else if(sc=='fatend'){
    updateFatParticles();
    if(mt<=0){afterFatality();}
  }
  else if(sc=='end'){
    upd(P,E,{});upd(E,P,{});
    if(mt<=0){
      if(roundWinsP>roundWinsE){
        // Should have been handled through fatready, but fallback
        playerScore+=10000;fi++;
        if(fi>=foes.length){
          if(foes.includes(0)){bossUnlocked=true;goToRanking();}
          else{sc='win';mt=1;}
        } else {round=1;roundWinsP=0;roundWinsE=0;startRound();}
      } else {sc='lose';mt=1;}
    }
  }

  sp.forEach(s=>s.t+=DT);sp=sp.filter(s=>s.t<.25);
  shake*=.85;
}

// === SPRITES & DRAWING ===
function fname(f){
  const s=f.st;
  if(s=='atk')return f.t<f.wind?'ready':f.type+(f.idx+1);
  if(s=='walk')return Math.floor(f.t*7)%2?'walk':(f.vx*f.face>0?'run':'idle');
  if(s=='ko')return f.t<.4?'hit':'hurt';
  return{idle:'idle',crouch:'crouch',guard:'guard',jump:'jump',hit:'hit',win:'win'}[s]||'idle';
}

function imgReady(img){return img&&img.complete&&img.naturalWidth>0&&img.naturalHeight>0;}
function spr(c,n,x,y,face){
  const r=c.fr[n];if(!r)return;
  if(!imgReady(c.A))return;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,G+2,60-Math.min(30,-y/4),9,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,G+y);ctx.scale(face,1);
  try{ctx.drawImage(c.A,r[0],D.ah-r[2],r[1],r[2],-r[3],-r[2],r[1],r[2]);}catch(e){}
  ctx.restore();
}

const PAL=[['#1b2a6b','#f08a4b'],['#2b1b52','#e0589a'],['#0e4a5c','#78d6c8'],['#2a4fb0','#cfe3ff']];
const BG={};
function mkBg(i){
  const c=document.createElement('canvas');c.width=900;c.height=450;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,370);g.addColorStop(0,PAL[i%4][0]);g.addColorStop(1,PAL[i%4][1]);
  x.fillStyle=g;x.fillRect(0,0,900,450);

    for(let k=0;k<14;k++){const cx=(k*137)%900,cy=60+(k*53)%260;x.beginPath();x.ellipse(cx,cy,70+k%3*20,16+k%4*5,0,0,7);x.fill();}
  } else {
    for(let k=0;k<16;k++){
      const h=70+(k*53)%120,w=56;
      x.fillStyle='rgba(8,8,30,.7)';x.fillRect(k*58,365-h,w,h);
      x.fillStyle='rgba(255,220,90,.8)';
      for(let a=0;a<h-12;a+=16)for(let b=6;b<w-6;b+=14)if((a*7+b*3+k)%5<2)x.fillRect(k*58+b,365-h+a+8,5,7);
    }

  x.fillStyle=g;x.fillRect(0,365,900,85);
  x.fillStyle='rgba(255,255,255,.15)';for(let k=0;k<10;k++)x.fillRect(0,372+k*k*.9,900,2);
  return c;
}

// Touch buttons — multi-touch con soporte DIAGONAL para el dpad
// _touchMap: touchId -> array de {k, atk, b} activos
const _touchMap={};
const _DPAD=['l','r','u','d'];

// Devuelve todos los botones que cubre el punto (con área expandida en dpad para diagonales)
function _getBtnsAt(cx,cy){
  const all=document.querySelectorAll('[data-k]');
  const hits=[];
  for(const el of all){
    const r=el.getBoundingClientRect();
    const isDpad=_DPAD.includes(el.dataset.k);
    // Los botones dpad tienen zona expandida un 55% extra en cada lado → diagonales naturales
    const margin=isDpad?r.width*0.55:0;
    if(cx>=r.left-margin&&cx<=r.right+margin&&cy>=r.top-margin&&cy<=r.bottom+margin){
      hits.push(el);
    }
  }
  // Si hay un botón de acción tocado exactamente, descartar dpad capturado solo por margen
  const hasExactAction=hits.some(el=>{
    if(_DPAD.includes(el.dataset.k))return false;
    const r=el.getBoundingClientRect();
    return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;
  });
  if(hasExactAction)return hits.filter(el=>{
    if(!_DPAD.includes(el.dataset.k))return true;
    const r=el.getBoundingClientRect();
    return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;
  });
  return hits;
}

function _activateBtns(btns){
  const active=[];
  for(const b of btns){
    const ks=b.dataset.k2?[b.dataset.k,b.dataset.k2]:[b.dataset.k];
    for(const k of ks){
      const atk=k=='p'||k=='k'||k=='sp'||k=='u';
      active.push({k,atk,b});
      if(sc=='fatready'){T.fat=1;continue;}
      if(atk)T[k]=1;else K[k]=1;
    }
    b.classList.add('on');
  }
  return active;
}

function _deactivateBtns(active){
  // Agrupar por b para solo hacer removeClass una vez por botón
  const seen=new Set();
  for(const {k,atk,b} of active){
    if(!seen.has(b)){seen.add(b);b.classList.remove('on');}
    if(!atk)K[k]=0;
  }
}

document.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    const btns=_getBtnsAt(t.clientX,t.clientY);
    if(!btns.length)continue;
    e.preventDefault();
    _touchMap[t.identifier]=_activateBtns(btns);
  }
},{passive:false});

document.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    const prev=_touchMap[t.identifier];
    const btns=_getBtnsAt(t.clientX,t.clientY);
    const newKeys=btns.map(b=>b.dataset.k+(b.dataset.k2?'+'+b.dataset.k2:'')).join(',');
    const prevKeys=prev?[...new Set(prev.map(x=>x.b).map(b=>b.dataset.k+(b.dataset.k2?'+'+b.dataset.k2:'')))].join(','):'';
    if(newKeys===prevKeys)continue; // sin cambio
    e.preventDefault();
    if(prev)_deactivateBtns(prev);
    if(btns.length){
      _touchMap[t.identifier]=_activateBtns(btns);
    } else {
      delete _touchMap[t.identifier];
    }
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    const prev=_touchMap[t.identifier];
    if(!prev)continue;
    e.preventDefault();
    _deactivateBtns(prev);
    delete _touchMap[t.identifier];
  }
},{passive:false});

document.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches){
    const prev=_touchMap[t.identifier];
    if(!prev)continue;
    _deactivateBtns(prev);
    delete _touchMap[t.identifier];
  }
},{passive:false});
